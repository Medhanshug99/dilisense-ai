version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: diligence
      POSTGRES_USER: diligence
      POSTGRES_PASSWORD: ${DB_PASSWORD:-diligence_secret}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diligence"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6380:6379"

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: diligence
      DB_USER: diligence
      DB_PASSWORD: ${DB_PASSWORD:-diligence_secret}
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage/raw
    volumes:
      - storagedata:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ingestion-worker:
    build:
      context: ./services/ingestion-worker
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: diligence
      DB_USER: diligence
      DB_PASSWORD: ${DB_PASSWORD:-diligence_secret}
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage/raw
    volumes:
      - storagedata:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  retrieval-service:
    build:
      context: ./services/retrieval-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: diligence
      DB_USER: diligence
      DB_PASSWORD: ${DB_PASSWORD:-diligence_secret}
    depends_on:
      postgres:
        condition: service_healthy
      ingestion-worker:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  storagedata:
